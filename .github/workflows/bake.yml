# Zet de kaartdata van een stad klaar in de cloud en zet die in data/<stad>/.
# Start via: Actions → "Kaartdata bakken" → Run workflow (of automatisch na een wijziging aan bake/ of cities/).
name: Kaartdata bakken
on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Stad (paris, new-york, amsterdam of all)'
        default: 'all'
      only:
        description: 'Onderdelen (buildings,base,places,transit)'
        default: 'buildings,base,places,transit'
  push:
    branches: [main]
    paths: ['bake/**', 'cities/*.js']
permissions:
  contents: write
concurrency: { group: bake, cancel-in-progress: false }
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: bake/requirements.txt }
      - run: pip install -r bake/requirements.txt
      - uses: actions/cache@v4
        with:
          path: bake/cache
          key: bake-cache-${{ github.run_id }}
          restore-keys: bake-cache-
      - name: Bakken
        run: |
          CITY="${{ github.event.inputs.city || 'all' }}"
          ONLY="${{ github.event.inputs.only || 'buildings,base,places,transit' }}"
          if [ "$CITY" = "all" ]; then CITIES="paris new-york amsterdam"; else CITIES="$CITY"; fi
          cd bake
          for c in $CITIES; do echo "::group::$c"; python bake.py "$c" --only "$ONLY" || echo "::error::$c mislukt"; echo "::endgroup::"; done
          du -sh ../data/* || true
      - name: Data opslaan in de repository
        run: |
          git config user.name "dwaal-bake"; git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "Geen wijzigingen" && exit 0
          git commit -m "Kaartdata bijgewerkt"
          git pull --rebase origin main && git push
