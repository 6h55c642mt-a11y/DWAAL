# Zet de kaartdata van een stad klaar in de cloud en zet die in data/<stad>/.
# Start via: Actions → "Kaartdata bakken" → Run workflow (bakken gaat alleen handmatig, zodat gidswijzigingen niet alles opnieuw bakken).
name: Kaartdata bakken
on:
  workflow_dispatch:
    inputs:
      city:
        description: 'Stad (paris, new-york, amsterdam of all)'
        default: 'all'
      only:
        description: 'Onderdelen (buildings,base,places,transit)'
        default: 'buildings,base,places,transit'
permissions:
  contents: write
concurrency: { group: bake, cancel-in-progress: false }
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: bake/requirements.txt }
      - run: sudo apt-get install -y -qq osmium-tool >/dev/null && pip install -r bake/requirements.txt
      - uses: actions/cache@v4
        with:
          path: bake/cache
          key: bake-cache-${{ github.run_id }}
          restore-keys: bake-cache-
      - name: Bakken
        shell: bash
        run: |
          CITY="${{ github.event.inputs.city || 'all' }}"
          ONLY="${{ github.event.inputs.only || 'buildings,base,places,transit' }}"
          if [ "$CITY" = "all" ]; then CITIES="paris new-york amsterdam london copenhagen stockholm vienna rome"; else CITIES="${CITY//,/ }"; fi
          mkdir -p data/_log; cd bake
          for c in $CITIES; do
            echo "::group::$c"
            python -u bake.py "$c" --only "$ONLY" 2>&1 | tee "../data/_log/$c.txt"; rc=${PIPESTATUS[0]}
            echo "exit $rc" >> "../data/_log/$c.txt"; [ $rc -ne 0 ] && echo "::error::$c mislukt"
            echo "::endgroup::"
            # tussentijds opslaan, zodat een latere stad die mislukt dit niet tenietdoet
            cd .. && git config user.name "dwaal-bake" && git config user.email "actions@users.noreply.github.com" && git add data && (git diff --cached --quiet || (git commit -q -m "Kaartdata $c" && git pull -q --rebase origin main && git push -q)) ; cd bake
          done
          du -sh ../data/* || true
