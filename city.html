<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E5E57">
<title>Dwaal – steden in 3D</title>
<meta property="og:title" content="Dwaal: ontdek de stad in 3D">
<meta property="og:description" content="Verken een stad voordat je er loopt: 3D-kaart, gids, routes en dagplanner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
<script>
// vang fouten zo vroeg mogelijk (ook als een module niet laadt) en toon ze in de lader
window.__dwaalErrs = [];
addEventListener('error', function (e) { var m = (e.message || 'Laadfout') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''); window.__dwaalErrs.push(m); var s = document.getElementById('lstat'); if (s) s.textContent = 'Fout: ' + m; }, true);
addEventListener('unhandledrejection', function (e) { var m = 'Promise: ' + ((e.reason && e.reason.message) || e.reason); window.__dwaalErrs.push(m); var s = document.getElementById('lstat'); if (s) s.textContent = 'Fout: ' + m; });
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
  "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.15/build/index.module.js"
} }
</script>
</head>
<body>
<canvas id="c" tabindex="0" aria-label="Interactieve 3D-kaart"></canvas>

<header class="topbar">
  <div class="brand"><span class="xxx" aria-hidden="true">✕✕✕</span><b>dwaal</b><span></span></div>
  <div class="spacer"></div>
  <button class="ibtn" id="btnSearch" aria-label="Zoek een plek of adres"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
  <button class="ibtn" id="btnSound" aria-label="Geluid" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="off" d="M16 9.5l5 5M21 9.5l-5 5"/></svg></button>
  <button class="ibtn" id="btnLocate" aria-label="Toon mijn locatie"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/><circle cx="12" cy="12" r="7"/></svg></button>
  <button class="ibtn" id="btnHome" aria-label="Terug naar overzicht"><svg viewBox="0 0 24 24"><path d="M12 3l3 7-3-1.6L9 10z" fill="var(--red)" stroke="var(--red)"/><circle cx="12" cy="12" r="9"/></svg></button>
</header>

<nav class="chips" id="chips" aria-label="Kaartlagen"></nav>
<div class="legend" id="legend" hidden></div>
<nav class="subchips" id="subchips" hidden aria-label="Soort eten en drinken"></nav>

<nav class="tabbar" id="tabbar" role="tablist">
  <button class="tab" role="tab" data-tab="ontdek" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Ontdek</button>
  <button class="tab" role="tab" data-tab="buurten" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3z"/><path d="M9 4v13M15 7v13"/></svg>Buurten</button>
  <button class="tab" role="tab" data-tab="plan" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16M8.5 14.5l2 2 4-4"/></svg>Plan</button>
  <button class="tab" role="tab" data-tab="routes" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.2"/><circle cx="18" cy="6" r="2.2"/><path d="M8 18h7a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h7"/></svg>Routes</button>
  <button class="tab" role="tab" data-tab="mijn" aria-selected="false" data-drop="route"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.4-6.5-11a6.5 6.5 0 0 1 13 0c0 5.6-6.5 11-6.5 11z"/><path d="M12 7v6M9 10h6"/></svg>Mijn route<i class="badge" id="tabBadge" hidden></i></button>
</nav>
<section class="panel" id="panel" aria-live="polite"><div class="grab" id="grab"></div><div class="pbody" id="pbody"></div></section>

<article class="card" id="card" hidden></article>
<button class="dock" id="dock" data-drop="route" aria-label="Open mijn route"><span class="dn" id="dockN">0</span><span id="dockL">Mijn route</span></button>

<div class="search" id="search" hidden role="dialog" aria-label="Zoeken">
  <div class="row"><input class="field" id="q" placeholder="Zoek een plek, café of adres" autocomplete="off"><button class="btn" id="qClose">Sluit</button></div>
  <div class="sres" id="qres"></div>
</div>

<div class="tour" id="tour" hidden></div>
<div class="toast" id="toast" role="status"></div>
<div class="ghost" id="ghost" hidden></div>

<div class="loader" id="loader">
  <h1 class="big"><em>✕✕✕</em>dwaal</h1>
  <p>Verken de stad voordat je er loopt. Tik op gebouwen, zet lagen aan en stel je eigen route samen.</p>
  <div class="lbar"><i id="lbar"></i></div>
  <div class="lstat" id="lstat">Kaart voorbereiden</div>
  <button class="startbtn" id="startBtn" hidden>Begin met verkennen</button>
</div>

<script type="module" src="js/engine.js"></script>
</body>
</html>
